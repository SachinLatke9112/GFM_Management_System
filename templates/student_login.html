<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login | GFM</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e3f2fd, #f4f6f9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 18px;
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin: -60px auto 20px;
        }

        .form-control {
            border-radius: 12px;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }

        .btn {
            border-radius: 30px;
            padding: 10px;
        }

        .toggle-password {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card login-card shadow p-4">

    <div class="login-icon">
        <i class="bi bi-mortarboard-fill"></i>
    </div>

    <h4 class="text-center fw-bold mb-3">Student Login</h4>
    <p class="text-center text-muted mb-4">Login to your GFM portal</p>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">PRN</label>
            <input type="text" name="prn" class="form-control" placeholder="Enter PRN" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
                <span class="input-group-text toggle-password" onclick="togglePassword()">
                    <i class="bi bi-eye"></i>
                </span>
            </div>
        </div>

        <button class="btn btn-primary w-100 mt-2">
            Login
        </button>
    </form>

    <p class="text-center mt-3">
        New student?
        <a href="/student/register" class="text-decoration-none fw-semibold">
            Register here
        </a>
    </p>

</div>

<script>
    function togglePassword() {
        const pwd = document.getElementById("password");
        pwd.type = pwd.type === "password" ? "text" : "password";
    }
</script>

</body>
</html>
