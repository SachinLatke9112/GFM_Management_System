{% extends 'base.html' %}
{% block title %}Student Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-5">
        <div class="glass-card p-5 animate-fade-up">

            <div class="text-center mb-4">
                <div class="d-inline-block bg-primary bg-opacity-10 rounded-circle p-4 mb-3">
                    <i class="bi bi-mortarboard-fill text-primary" style="font-size: 2.5rem;"></i>
                </div>
                <h3 class="fw-bold">Student Login</h3>
                <p class="text-muted">Welcome back! Please login to your account.</p>
            </div>

            <form method="POST">
                <div class="mb-4">
                    <label>PRN Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="prn" class="form-control border-start-0 ps-0" placeholder="Enter PRN" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label>Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="password" id="password" class="form-control border-start-0 border-end-0 ps-0" placeholder="Enter password" required>
                        <span class="input-group-text bg-white cursor-pointer toggle-password" onclick="togglePassword()">
                            <i class="bi bi-eye text-muted"></i>
                        </span>
                    </div>
                </div>

                <button class="btn-premium w-100 py-2 mb-3">Login</button>
            </form>

            <p class="text-center mt-4 mb-0 text-muted">
                New student? <a href="/student/register" class="text-primary fw-bold text-decoration-none">Register here</a>
            </p>

        </div>
    </div>
</div>

<script>
    function togglePassword() {
        const pwd = document.getElementById("password");
        const icon = document.querySelector(".toggle-password i");
        if(pwd.type === "password") {
            pwd.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        } else {
            pwd.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        }
    }
</script>
{% endblock %}
