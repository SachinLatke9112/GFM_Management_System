<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit GFM Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #dfe9f3);
            font-family: "Segoe UI", sans-serif;
        }

        .edit-card {
            border-radius: 18px;
            animation: fadeUp 0.7s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h3 {
            font-weight: 700;
        }

        .section-title {
            font-weight: 600;
            font-size: 1.15rem;
            margin-top: 25px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: "▸";
            color: #0d6efd;
            font-size: 1.3rem;
            margin-right: 8px;
        }

        label {
            font-weight: 500;
            margin-top: 10px;
        }

        .form-control, .form-select {
            border-radius: 12px;
            transition: 0.25s;
        }

        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.15rem rgba(13,110,253,.2);
        }

        .save-btn {
            border-radius: 30px;
            padding: 10px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .save-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="card edit-card shadow p-4">

        <h3 class="text-center mb-4">Edit GFM Details</h3>

        <form method="POST">

            <!-- PERSONAL DETAILS -->
            <div class="section-title">Personal Details</div>
            <hr>

            <label>Name</label>
            <input type="text" name="name" value="{{ student.name }}" class="form-control">

            <label>Email</label>
            <input type="email" name="email" value="{{ student.email }}" class="form-control">

            <label>Phone</label>
            <input type="text" name="phone" value="{{ student.phone }}" class="form-control">

            <label>Gender</label>
            <select name="gender" class="form-select">
                <option {{ 'selected' if student.gender == 'Male' }}>Male</option>
                <option {{ 'selected' if student.gender == 'Female' }}>Female</option>
            </select>

            <label>DOB</label>
            <input type="date" name="dob" value="{{ student.dob }}" class="form-control">

            <label>Division</label>
            <input type="text" name="division" value="{{ student.division }}" class="form-control">

            <label>Year</label>
            <select name="year" class="form-select">
                <option {{ 'selected' if student.year == 'SE' }}>SE</option>
                <option {{ 'selected' if student.year == 'TE' }}>TE</option>
                <option {{ 'selected' if student.year == 'BE' }}>BE</option>
            </select>

            <label>Address</label>
            <textarea name="address" rows="3" class="form-control">{{ student.address }}</textarea>

            <!-- ACADEMIC DETAILS -->
            <div class="section-title">Academic Details</div>
            <hr>

            <label>SSC Marks</label>
            <input type="number" name="ssc_marks" value="{{ student.ssc_marks }}" class="form-control">

            <label>HSC Marks</label>
            <input type="number" name="hsc_marks" value="{{ student.hsc_marks }}" class="form-control">

            <label>FE Sem 1</label>
            <input type="number" name="fe_sem1" value="{{ student.fe_sem1 }}" class="form-control">

            <label>FE Sem 2</label>
            <input type="number" name="fe_sem2" value="{{ student.fe_sem2 }}" class="form-control">

            <label>SE Sem 1</label>
            <input type="number" name="se_sem1" value="{{ student.se_sem1 }}" class="form-control">

            <label>SE Sem 2</label>
            <input type="number" name="se_sem2" value="{{ student.se_sem2 }}" class="form-control">

            <label>TE Sem 1</label>
            <input type="number" name="te_sem1" value="{{ student.te_sem1 }}" class="form-control">

            <label>TE Sem 2</label>
            <input type="number" name="te_sem2" value="{{ student.te_sem2 }}" class="form-control">

            <label>BE Sem 1</label>
            <input type="number" name="be_sem1" value="{{ student.be_sem1 }}" class="form-control">

            <label>BE Sem 2</label>
            <input type="number" name="be_sem2" value="{{ student.be_sem2 }}" class="form-control mb-4">

            <button class="btn btn-primary w-100 save-btn">
                💾 Update GFM Data
            </button>

        </form>

    </div>
</div>

</body>
</html>
