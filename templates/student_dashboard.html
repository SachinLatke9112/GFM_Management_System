{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}

{% block content %}

<style>
    .dashboard-card {
        border-radius: 18px;
        animation: fadeUp 0.6s ease;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .profile-img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid #0d6efd;
        transition: 0.3s;
    }

    .profile-img:hover {
        transform: scale(1.05);
    }

    .info-box p {
        margin-bottom: 6px;
        font-size: 0.95rem;
    }

    .action-btn {
        border-radius: 30px;
        padding: 8px 22px;
        transition: 0.3s;
    }

    .action-btn:hover {
        transform: translateY(-2px);
    }
</style>

<div class="card dashboard-card shadow p-4">

    <div class="row align-items-center">
        <!-- Profile Image -->
        <div class="col-md-3 text-center mb-3 mb-md-0">
            <img src="/uploads/{{ student.photo }}" class="profile-img" alt="Student Photo">
        </div>

        <!-- Student Info -->
        <div class="col-md-9 info-box">
            <h4 class="fw-bold mb-2">{{ student.name }}</h4>
            <p><b>PRN:</b> {{ student.prn }}</p>
            <p><b>Division:</b> {{ student.division }}</p>

            <div class="mt-3 d-flex gap-2 flex-wrap">
                <a href="/student/edit" class="btn btn-info action-btn">
                    ✏️ Edit GFM Data
                </a>
                <a href="/logout" class="btn btn-secondary action-btn">
                    🔒 Logout
                </a>
            </div>
        </div>
    </div>

</div>

{% endblock %}
