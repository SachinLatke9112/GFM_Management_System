<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GFM Submission Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #e0eafc, #cfdef3);
}
.card {
    border-radius: 16px;
    padding: 30px;
    background: #ffffffee;
}
.form-step { display: none; }
.form-step-active { display: block; }
.progress { height: 8px; }
</style>
</head>

<body>
<div class="container mt-5 mb-5">
<div class="card mx-auto" style="max-width:900px">

<h3 class="text-center fw-bold mb-4">
PROGRESSIVE INFORMATION & COUNSELLING FORM
</h3>

<div class="progress mb-4">
<div class="progress-bar" id="progressBar" style="width:25%"></div>
</div>

<form method="POST" enctype="multipart/form-data">

<!-- STEP 1 : PERSONAL -->
<div class="form-step form-step-active">
<h5 class="fw-bold">👤 Personal Information</h5><hr>
<div class="row g-3">
<input class="form-control col-md-6" name="name" placeholder="Student Name" required>
<input class="form-control col-md-6" name="mother_name" placeholder="Mother Name" required>
<input class="form-control col-md-6" name="father_name" placeholder="Father Name">
<input class="form-control col-md-3" name="prn" placeholder="PRN" required>
<input class="form-control col-md-3" name="division" placeholder="Division" required>

<select class="form-select col-md-3" name="gender" required>
<option value="">Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<select class="form-select col-md-3" name="blood_group">
<option value="">Blood Group</option>
<option>A+</option><option>B+</option><option>O+</option><option>AB+</option>
</select>

<input type="date" class="form-control col-md-4" name="dob" required>
<input class="form-control col-md-4" name="email" placeholder="Email">
<input class="form-control col-md-4" name="phone" placeholder="Mobile">

<select class="form-select col-md-4" name="year" required>
<option value="">Year</option>
<option>SE</option><option>TE</option><option>BE</option>
</select>

<textarea class="form-control col-12" name="address" placeholder="Permanent Address" rows="3"></textarea>
</div>

<div class="text-end mt-4">
<button type="button" class="btn btn-primary next">Next</button>
</div>
</div>

<!-- STEP 2 : PHOTO -->
<div class="form-step">
<h5 class="fw-bold">📸 Upload Photo</h5><hr>
<input type="file" class="form-control" name="photo" accept="image/*" required>
<img id="preview" class="mt-3" width="140">
<div class="d-flex justify-content-between mt-4">
<button type="button" class="btn btn-secondary prev">Previous</button>
<button type="button" class="btn btn-primary next">Next</button>
</div>
</div>

<!-- STEP 3 : EDUCATION -->
<div class="form-step">
<h5 class="fw-bold">🎓 Educational Details</h5><hr>

<table class="table table-bordered text-center">
<tr><th>Exam</th><th>Board</th><th>Year</th><th>Marks</th></tr>
<tr>
<td>SSC</td>
<td><input name="ssc_board" class="form-control"></td>
<td><input name="ssc_year" class="form-control"></td>
<td><input name="ssc_marks" class="form-control"></td>
</tr>
<tr>
<td>HSC / Diploma</td>
<td><input name="hsc_board" class="form-control"></td>
<td><input name="hsc_year" class="form-control"></td>
<td><input name="hsc_marks" class="form-control"></td>
</tr>
</table>

<input class="form-control mb-2" name="cet_rank" placeholder="CET Rank">
<input class="form-control" name="institute" placeholder="Institute Name">

<div class="d-flex justify-content-between mt-4">
<button type="button" class="btn btn-secondary prev">Previous</button>
<button type="button" class="btn btn-primary next">Next</button>
</div>
</div>

<!-- STEP 4 : ACADEMICS -->
<div class="form-step">
<h5 class="fw-bold">📊 Academic Performance</h5><hr>

<table class="table table-bordered text-center">
<tr>
<th>FE 1</th><th>FE 2</th>
<th>SE 1</th><th>SE 2</th>
<th>TE 1</th><th>TE 2</th>
<th>BE 1</th><th>BE 2</th>
</tr>
<tr>
<td><input name="fe_sem1" class="form-control"></td>
<td><input name="fe_sem2" class="form-control"></td>
<td><input name="se_sem1" class="form-control"></td>
<td><input name="se_sem2" class="form-control"></td>
<td><input name="te_sem1" class="form-control"></td>
<td><input name="te_sem2" class="form-control"></td>
<td><input name="be_sem1" class="form-control"></td>
<td><input name="be_sem2" class="form-control"></td>
</tr>
</table>

<div class="d-flex justify-content-between mt-4">
<button type="button" class="btn btn-secondary prev">Previous</button>
<button type="submit" class="btn btn-success">Submit GFM</button>
</div>
</div>

</form>
</div>
</div>

<script>
const steps = document.querySelectorAll(".form-step");
let current = 0;
const bar = document.getElementById("progressBar");

document.querySelectorAll(".next").forEach(b =>
b.onclick = () => {
steps[current].classList.remove("form-step-active");
current++;
steps[current].classList.add("form-step-active");
bar.style.width = ((current+1)/steps.length*100)+"%";
});

document.querySelectorAll(".prev").forEach(b =>
b.onclick = () => {
steps[current].classList.remove("form-step-active");
current--;
steps[current].classList.add("form-step-active");
bar.style.width = ((current+1)/steps.length*100)+"%";
});
</script>

</body>
</html>
