{% extends 'base.html' %}
{% block title %}Complete GFM Details{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-card shadow p-5 animate-fade-up">

            <div class="text-center mb-5">
                <div class="d-inline-block bg-primary bg-opacity-10 rounded-circle p-3 mb-3">
                    <i class="bi bi-file-earmark-person text-primary" style="font-size: 2rem;"></i>
                </div>
                <h3 class="fw-bold">Complete Your GFM Profile</h3>
                <p class="text-muted">Please fill in your personal and academic records below to continue.</p>
            </div>

            <form method="POST" enctype="multipart/form-data">

                <!-- PERSONAL DETAILS -->
                <h5 class="fw-bold text-primary mb-4 border-bottom pb-2">
                    <i class="bi bi-person-lines-fill me-2"></i>Personal Details
                </h5>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label>Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="col-md-6">
                        <label>Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="student@example.com" required>
                    </div>
                    <div class="col-md-6">
                        <label>Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="+91 XXXXX XXXXX" required>
                    </div>
                    <div class="col-md-6">
                        <label>Gender</label>
                        <select name="gender" class="form-select" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label>Date of Birth</label>
                        <input type="date" name="dob" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label>Division</label>
                        <input type="text" name="division" class="form-control" placeholder="e.g. TE T2" required>
                    </div>
                    <div class="col-md-3">
                        <label>Year</label>
                        <select name="year" class="form-select" required>
                            <option value="">Select Year</option>
                            <option>SE</option>
                            <option>TE</option>
                            <option>BE</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label>Address</label>
                        <textarea name="address" rows="3" class="form-control" placeholder="Enter your full address..." required></textarea>
                    </div>
                    <div class="col-12">
                        <label>Upload Photo</label>
                        <input type="file" name="photo" class="form-control" accept="image/*" required>
                        <small class="text-muted">Please provide a clear passport-size photo.</small>
                    </div>
                </div>

                <!-- ACADEMIC DETAILS -->
                <h5 class="fw-bold text-primary mb-4 border-bottom pb-2 mt-5">
                    <i class="bi bi-journal-bookmark-fill me-2"></i>Academic Details
                </h5>
                
                <div class="row g-3 mb-5">
                    <div class="col-md-6">
                        <label>SSC Marks (%)</label>
                        <input type="number" step="0.01" name="ssc_marks" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>HSC Marks (%)</label>
                        <input type="number" step="0.01" name="hsc_marks" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>FE Sem 1 SGPA</label>
                        <input type="number" step="0.01" name="fe_sem1" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>FE Sem 2 SGPA</label>
                        <input type="number" step="0.01" name="fe_sem2" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>SE Sem 1 SGPA</label>
                        <input type="number" step="0.01" name="se_sem1" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>SE Sem 2 SGPA</label>
                        <input type="number" step="0.01" name="se_sem2" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>TE Sem 1 SGPA</label>
                        <input type="number" step="0.01" name="te_sem1" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>TE Sem 2 SGPA</label>
                        <input type="number" step="0.01" name="te_sem2" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>BE Sem 1 SGPA</label>
                        <input type="number" step="0.01" name="be_sem1" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>BE Sem 2 SGPA</label>
                        <input type="number" step="0.01" name="be_sem2" class="form-control">
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn-premium px-5 py-2">
                        💾 Submit & Complete Profile
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
